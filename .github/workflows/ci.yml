name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop


jobs:

  test-and-build:

    runs-on: ubuntu-latest

    services:

      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: enterprise_user
          POSTGRES_PASSWORD: enterprise_password
          POSTGRES_DB: enterprise_task_test_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U enterprise_user -d enterprise_task_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5


      redis:
        image: redis:7

        ports:
          - 6379:6379

        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5


    env:

      DATABASE_URL: postgresql+psycopg2://enterprise_user:enterprise_password@localhost:5432/enterprise_task_test_db

      TEST_DATABASE_URL: postgresql+psycopg2://enterprise_user:enterprise_password@localhost:5432/enterprise_task_test_db

      REDIS_URL: redis://localhost:6379/0

      SECRET_KEY: github-actions-test-secret-key-at-least-32-bytes-long

      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 30

      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:8000/api/v1/auth/google/callback

      FRONTEND_URL: http://localhost:3000

      ENVIRONMENT: test


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run tests
        run: |
          python -m pytest -v


      - name: Build Docker image
        run: |
          docker build -t enterprise-task-api:test .