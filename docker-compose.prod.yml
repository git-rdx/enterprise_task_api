services:

  api:
    image: ${ECR_IMAGE}

    container_name: enterprise-task-api

    env_file:
      - .env

    ports:
      - "8000:8000"

    restart: unless-stopped


  celery:
    image: ${ECR_IMAGE}

    container_name: enterprise-task-celery

    command:
      [
        "celery",
        "-A",
        "app.celery_app.celery_app",
        "worker",
        "--loglevel=info"
      ]

    env_file:
      - .env

    restart: unless-stopped